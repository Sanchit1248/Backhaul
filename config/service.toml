# Service configuration. Everything the organizers might change mid-build lives HERE,
# not in code: at hour 3 there is a requirement change (new output field, lower cost
# limit, ...). Change this file, re-run evals, commit.

[client]
# Released at kickoff. Fill in.
name = "TBD"
records_dir = "data/client"     # client records from the kickoff kit

[limits]
max_cost_usd = 1.00             # hard stop per run
max_seconds = 300               # hard stop per run
max_llm_calls = 50

[llm]
model = "claude-opus-5-5"       # main reasoning model
cheap_model = "claude-haiku-5-5" # bulk extraction / classification
effort = "medium"

# USD per 1M tokens (Anthropic first-party prices, checked 2026-11-22).
[llm.pricing.claude-opus-5-5]
input = 4.00
output = 20.00
cache_read = 0.20
[llm.pricing.claude-sonnet-5-5]
input = 2.00
output = 10.00
cache_read = 0.10
[llm.pricing.claude-haiku-5-5]
input = 0.10
output = 0.50
# cache_read omitted -> llm.py assumes 0.1 x input

[output]
# Fields every result must contain. Add new ones here if the requirement changes.
required_fields = ["status", "facts", "cost_usd"]
cannot_verify_label = "cannot verify"

[approval]
# Action kinds that cannot be undone -> always wait for a human.
irreversible = ["payment", "send_email", "send_message", "sign_offer", "book_meeting"]

[fx]
usd_to_inr = 84.0               # for pricing the job in rupees; update before finals
